", "note": "随机事件，走路时触发"}, "lines": [{"who": "旁白", "text": "路边开着一丛不知名的野花，风一吹就晃。"}], "choices": [{"text": "采一朵。", "effects": {"mood": 2}, "reply": "你把花别在包上，心情好了点。"}], "once": true}, "R2_lost_sheep": {"id": "R2_lost_sheep", "title": "迷路的羊", "day": 3, "scene": "纳塔莱斯港郊外·草场", "trigger": {"type": "step", "note": "随机事件"}, "lines": [{"who": "旁白", "text": "一只羊卡在铁丝网边，咩咩直叫。"}], "choices": [{"text": "帮它解开。", "effects": {"stamina": -3, "mood": 3}, "reply": "羊跑了，你拍了拍手上的土。"}, {"text": "不管。", "effects": {}, "reply": "你走开了，羊叫声越来越远。"}], "once": true}, "R3_parrot": {"id": "R3_parrot", "title": "鹦鹉", "day": 4, "scene": "纳塔莱斯港·旅舍院子", "trigger": {"type": "step", "note": "随机事件"}, "lines": [{"who": "旁白", "text": "一只鹦鹉落在晾衣绳上，冲你歪头。"}], "choices": [{"text": "逗它玩。", "effects": {"mood": 4}, "reply": "鹦鹉学舌：“Hola！Hola！”"}], "once": true}, "R4_shoelace": {"id": "R4_shoelace", "title": "鞋带", "day": 5, "scene": "纳塔莱斯港外·山路", "trigger": {"type": "step", "note": "随机事件"}, "lines": [{"who": "旁白", "text": "鞋带松了，你低头看了一眼。"}], "choices": [{"text": "不管，继续走。", "effects": {"stamina": -5, "mood": -2}, "reply": "你绊了一下，膝盖磕在石头上。"}, {"text": "蹲下系好。", "effects": {}, "reply": "你系好鞋带，继续赶路。"}], "once": true}, "R5_apple_tree": {"id": "R5_apple_tree", "title": "苹果树", "day": 6, "scene": "纳塔莱斯港·路边果园", "trigger": {"type": "step", "note": "随机事件"}, "lines": [{"who": "旁白", "text": "路边一棵苹果树，果子熟得发红。"}], "choices": [{"text": "摘几个。", "effects": {"food": 2, "mood": 2}, "reply": "你摘了苹果，塞进包里。"}, {"text": "不摘，留给别人。", "effects": {"mood": 3}, "reply": "你看了两眼，走了。"}], "once": true}, "R6_stars": {"id": "R6_stars", "title": "星空", "day": 6, "scene": "纳塔莱斯港·营地", "trigger": {"type": "auto", "note": "随机事件，夜晚触发"}, "lines": [{"who": "旁白", "text": "这里的夜空低得吓人，星星铺满头顶。"}], "choices": [{"text": "看一会儿星星。", "effects": {"mood": 5}, "reply": "你躺下来，忘了膝盖的疼。"}], "once": true}};

ctx.fillStyle="#eec39a";ctx.fillRect(8,-14,16,12);
ctx.fillStyle=hair;ctx.fillRect(8,-15,16,5);
ctx.fillStyle="#222";const ex=dir==="left"?10:(dir==="right"?18:12);ctx.fillRect(ex,-8,2,2);ctx.fillRect(ex+6,-8,2,2);
ctx.restore();
if(name){ctx.font="11px sans-serif";ctx.textAlign="center";ctx.fillStyle="rgba(20,16,10,.65)";const w=ctx.measureText(name).width+10;ctx.fillRect(x+16-w/2,y-32,w,15);ctx.fillStyle="#f3e9d2";ctx.fillText(name,x+16,y-21);}
if(alert){ctx.font="bold 15px sans-serif";ctx.textAlign="center";ctx.fillStyle="#ffd94d";ctx.fillText("!",x+16,y-38);}}
function npcHasEvent(n){return n.chain.some(id=>!isDone(id)&&gatePass(id));}
function gatePass(id){
if(id==="H1_share_bread")return isDone("day1_bakery");
if(id==="day3_lo_siento_learn")return isDone("H2_road_wallet");
if(id==="day1_por_favor_learn")return isDone("day1_bakery");
return true;}
function render(tick){const sc=SCENES[game.scene];ctx.clearRect(0,0,VIEW_W,VIEW_H);
for(let y=0;y<sc.map.length;y++)for(let x=0;x<sc.map[0].length;x++)drawTile(TILECOLOR[sc.map[y][x]]||"#888",x,y,sc.map[y][x],tick);
spotsHere.forEach(s=>{if(s.doneSpot)return;if(s.kind==="sparkle"){ctx.fillStyle=(tick/20)%2<1?"#ffe97a":"#fff3b0";ctx.font="15px sans-serif";ctx.textAlign="center";ctx.fillText("✦",s.x*TILE+16,s.y*TILE+14+Math.sin(tick/16)*2);}});
const ents=[...npcsHere.map(n=>({y:n.py,k:"n",n})),{y:player.y,k:"p"}].sort((a,b)=>a.y-b.y);
ents.forEach(e=>{if(e.k==="p")drawChar(player.x,player.y,"#b03a2e","#3a2a1a",true,player.dir,player.frame,"",false);
else drawChar(e.n.px,e.n.py,e.n.body,e.n.hair,false,"down",0,e.n.name,npcHasEvent(e.n));});
const wk=game.weather.w;
if(wk==="rain"){ctx.strokeStyle="rgba(200,220,255,.55)";ctx.lineWidth=1;ctx.beginPath();
rainDrops.forEach(d=>{ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-3,d.y+d.s);});ctx.stroke();}
if(game.flags.phase===3){ctx.fillStyle="rgba(217,125,69,.10)";ctx.fillRect(0,0,VIEW_W,VIEW_H);}
if(game.scene==="port"||game.scene==="town"){ctx.fillStyle="rgba(29,46,68,.05)";ctx.fillRect(0,0,VIEW_W,VIEW_H);}}
/* ================= 移动与互动 ================= */
const keys={};let touchDir=null;
function tryInteract(){
const fx=player.x+16,fy=player.y+16;
const dirs={down:[0,26],up:[0,-26],left:[-26,0],right:[26,0]};const d=dirs[player.dir];
const tx=fx+d[0],ty=fy+d[1];
const npc=npcsHere.find(n=>Math.abs(n.px+16-tx)<30&&Math.abs(n.py+16-ty)<30);
if(npc){talkNPC(npc);return;}
const spot=spotsHere.find(s=>!s.doneSpot&&Math.abs(s.x*TILE+16-tx)<28&&Math.abs(s.y*TILE+16-ty)<28);
if(spot){fireSpot(spot);return;}}
function talkNPC(n){
if(n.id==="marta"&&isDone("day1_bakery")&&isDone("day1_por_favor_learn")){shopDialog();return;}
const nextId=n.chain.find(id=>!isDone(id));
if(nextId&&gatePass(nextId)){runEvent(nextId);return;}
if(nextId&&!gatePass(nextId)){playLines([{who:n.name,text:n.id==="sofia"?"（先去妈妈店里把面包买了吧，她在等你呢。）":"（先把手头的事做完，再来找我。）"}],0,()=>{game.mode="walk";hideDialog();});game.mode="dialog";return;}
playLines([{who:n.name,text:n.ambient||"……"}],0,()=>{game.mode="walk";hideDialog();});game.mode="dialog";}
function shopDialog(){game.mode="dialog";
playLines([{who:"玛尔塔",text:"面包 300 比索一个，刚出炉的。要几个？"}],0,()=>{
showChoices([{text:"买一个面包（-300 比索，食物+1）"},{text:"不买了"}],c=>{
if(c.text.startsWith("买")){if(game.res.money>=300&&game.res.food<10){applyEffects({money:-300,food:1});playLines([{who:"玛尔塔",text:"拿好。路上饿了就吃，别省——省不出个家来。"}],0,()=>{game.mode="walk";hideDialog();});}
else playLines([{who:"玛尔塔",text:game.res.money<300?"钱不够啦，孩子。去农场帮工能挣钱。":"背包都满啦，装不下了。"}],0,()=>{game.mode="walk";hideDialog();});}
else{game.mode="walk";hideDialog();}});});}
function fireSpot(s){if(s.event){game.mode="dialog";runEvent(s.event,()=>{if(s.chainNext&&!isDone(s.chainNext))runEvent(s.chainNext);});s.doneSpot=true;return;}
if(s.lines){game.mode="dialog";playLines(s.lines,0,()=>{applyEffects(s.effects);game.mode="walk";hideDialog();});s.doneSpot=true;}}
function checkStepTriggers(){
const sc=SCENES[game.scene],tx=Math.floor((player.x+16)/TILE),ty=Math.floor((player.y+16)/TILE);
const sp=spotsHere.find(s=>!s.doneSpot&&s.kind==="sparkle"&&s.x===tx&&s.y===ty);
if(sp){fireSpot(sp);return;}
if(game.day===2&&!isDone("day2_forecast_proved")&&game.dayWalkPx>750){runEvent("day2_forecast_proved");return;}
if(sc.exit&&ty<=sc.exit.y&&tx>=sc.exit.x1&&tx<=sc.exit.x2){onExit();}}
function onExit(){const now=Date.now();
if(game.day===7){if(isDone("day7_ending"))return;
if(isDone("day7_farewell")&&isDone("day7_buen_viaje_learn")){runEvent("day7_ending",showSettlement);}
else if(now-exitHintAt>2500){exitHintAt=now;toast("先去码头见卡洛斯，再走到码头尽头听听他最后的话。");player.y+=TILE;}
return;}
const missing=(REQUIRED[game.day]||[]).filter(id=>!isDone(id));
if(missing.length){if(now-exitHintAt>2500){exitHintAt=now;game.mode="dialog";
playLines([{who:"旁白",text:"还没到走的时候——"+missing.map(id=>REQUIRED_LABEL[id]).join("；")+"。"}],0,()=>{game.mode="walk";hideDialog();});}
player.y+=TILE;return;}
openCamp(true);}
function update(dt){let dx=0,dy=0;
if(keys["arrowup"]||keys["w"]||touchDir==="up")dy=-1;else if(keys["arrowdown"]||keys["s"]||touchDir==="down")dy=1;
else if(keys["arrowleft"]||keys["a"]||touchDir==="left")dx=-1;else if(keys["arrowright"]||keys["d"]||touchDir==="right")dx=1;
player.moving=!!(dx||dy);
if(player.moving){player.dir=dy<0?"up":dy>0?"down":dx<0?"left":"right";player.ft+=dt;if(player.ft>.16){player.ft=0;player.frame++;}
const wk=game.weather.w;let speed=132;let drain=1/230;
if(wk==="rain"){speed*=.85;drain*=1.5;} if(game.day===5&&wk==="wind"){speed*=.8;drain*=1.5;} if(game.day===1&&wk==="wind"){drain*=1.15;}
const mx=dx*speed*dt,my=dy*speed*dt;
if(mx&&!collide(player.x+mx,player.y))player.x+=mx;
if(my&&!collide(player.x,player.y+my))player.y+=my;
player.x=clamp(player.x,0,VIEW_W-32);player.y=clamp(player.y,0,VIEW_H-32);
const dist=Math.abs(mx)+Math.abs(my);game.walkPx+=dist;game.dayWalkPx+=dist;
game.flags.drainAcc=(game.flags.drainAcc||0)+dist*drain;
if(game.flags.drainAcc>=1){const d=Math.floor(game.flags.drainAcc);game.flags.drainAcc-=d;game.res.stamina=clamp(game.res.stamina-d,0,100);updateHUD();
if(game.res.stamina<=0){game.res.stamina=30;game.res.mood=clamp(game.res.mood-3,0,100);game.mode="dialog";
playLines([{who:"旁白",text:"你眼前一黑，扶着路牌坐了下来。膝盖在抗议，肚子也在抗议。"},{who:"你",text:"（不能再这么走了。吃点东西，慢一点。）体力恢复到 30，心情 -3。"}],0,()=>{game.mode="walk";hideDialog();updateHUD();});}}
checkStepTriggers();}
if(game.weather.w==="rain")rainDrops.forEach(d=>{d.y+=d.s*2.2;d.x-=2;if(d.y>VIEW_H){d.y=-10;d.x=Math.random()*VIEW_W;}});}
/* ================= 面板：词库 / 扎营 / 结算 ================= */
const panel=$("panel"),panelBox=$("panelBox");
function showPanel(html){panelBox.innerHTML=html;panel.style.display="flex";game.mode="panel";}
function hidePanel(){panel.style.display="none";if(game.mode==="panel")game.mode="walk";}
function openWords(){const learned=Object.keys(WORDS).map(id=>({id,...WORDS[id],got:hasWord(id)}));
showPanel("<h2>📖 我的西语词库（"+game.words.length+" / 24）</h2><p>每学会一个词，就多一条活下去的路。</p><div class='wordgrid'>"+
learned.map(w=>"<div class='w"+(w.got?"":" lock")+"'>"+(w.got?"<b>"+w.es+"</b> · "+w.zh:"？？？ · 还没学会")+"</div>").join("")+
"</div><div class='row'><button onclick='hidePanel()'>合上词库</button></div>");}
function openCamp(arrival){if(game.day===6&&isDone("day6_night_talk")&&!isDone("H5_last_bread")){runEvent("H5_last_bread",()=>openCamp(arrival));return;}
const sc=SCENES[game.scene];
const canQuiz=game.day>=6&&game.words.length>=6&&!game.quizDone;
showPanel("<h2>⛺ "+(arrival?"到达"+sc.sleepLabel:sc.name+" · 休整")+"</h2>"+
"<p>第 "+game.day+" 天。体力 "+game.res.stamina+" · 食物 "+game.res.food+" · 比索 "+game.res.money+" · 心情 "+game.res.mood+"</p>"+
"<p>"+(arrival?"今天的路走完了。篝火/床铺都准备好了，睡一觉，明天继续向北。":"停下来歇一会儿。吃点热的，看看词库，或者直接睡。")+"</p>"+
"<div class='row'>"+
"<button id='cCook' "+(game.cookedDay===game.day||game.res.food<=0?"disabled":"")+">🍳 做饭加餐（食物-1，体力+10）</button>"+
(canQuiz?"<button id='cQuiz'>📝 词库小测（6 题）</button>":"")+
"<button id='cWords'>📖 看词库</button>"+
(game.day<7?"<button id='cSleep'>😴 睡觉 → 第 "+(game.day+1)+" 天</button>":"")+
"<button class='ghost' onclick='hidePanel()'>继续走</button></div>"+
(game.day===6&&!isDone("day6_night_talk")?"<p style='color:#f6d47c'>露西娅在篝火边等你——先去和她说说话，再睡也不迟。</p>":""));
const cq=$("cCook");if(cq)cq.onclick=()=>{game.cookedDay=game.day;applyEffects({food:-1,stamina:10,mood:2});toast("🍲 吃了顿热的。体力+10，心情+2");openCamp(arrival);};
const qz=$("cQuiz");if(qz)qz.onclick=()=>{hidePanel();startQuiz();};
const wd=$("cWords");if(wd)wd.onclick=()=>openWords();
const sl=$("cSleep");if(sl)sl.onclick=()=>{hidePanel();doSleep();};}
function startQuiz(){const pool=[...game.words].sort(()=>Math.random()-.5).slice(0,6);let i=0,score=0;game.mode="dialog";
const ask=()=>{if(i>=pool.length){game.quizDone=true;playLines([{who:"露西娅",text:"小测结束：答对 "+score+" / "+pool.length+"。不错——半年前你连 Hola 都不会说呢。"}],0,()=>{game.mode="walk";hideDialog();saveGame(true);});return;}
const id=pool[i],w=WORDS[id];const others=Object.keys(WORDS).filter(k=>k!==id).sort(()=>Math.random()-.5).slice(0,3);
const opts=[w.zh,...others.map(k=>WORDS[k].zh)].sort(()=>Math.random()-.5);
playLines([{who:"露西娅",text:"第 "+(i+1)+" 题：「"+w.es+"」是什么意思？"}],0,()=>{
showChoices(opts.map(o=>({text:o})),c=>{const right=c.text===w.zh;if(right){score++;applyEffects({mood:2});}
playLines([{who:"露西娅",text:right?"对！就是「"+w.zh+"」。":"不对哦——「"+w.es+"」是「"+w.zh+"」。没关系，错过一次记得更牢。"}],0,()=>{i++;ask();});});});};
ask();}
function doSleep(){const sc=SCENES[game.scene];
if(game.day===4&&game.scene==="lake"&&!isDone("H4_blanket")){runEvent("H4_blanket",()=>runEvent("day4_knee_pain_night",()=>doSleep()));return;}
let restore=SLEEP_RESTORE[sc.sleep]||35;let note=[];
if(game.res.food>0){game.res.food-=1;note.push("晚餐吃掉 1 份食物");}else{restore=Math.floor(restore/2);game.res.mood=clamp(game.res.mood-5,0,100);note.push("没东西吃，饿着肚子睡，恢复减半，心情 -5");}
if(game.day===4&&hasMem("blanket_given")){restore-=10;note.push("毯子让给了阿图罗，这一夜有点冷");}
game.res.stamina=clamp(game.res.stamina+restore,0,100);
game.day+=1;game.weather=WEEK[game.day];loadScene(DAY_SCENE[game.day]);updatePhase();
saveGame(true);startDay(note.join("；")+"。体力恢复 +"+restore+"。");}
function startDay(extraNote){updateHUD();
if(game.day>1){if(game.res.food>0){game.res.food-=1;}else{game.res.mood=clamp(game.res.mood-5,0,100);toast("🍞 没有早餐，心情 -5",3000);}updateHUD();}
const morning=()=>{const wk=game.weather;game.mode="dialog";
playLines([{who:"旁白",text:"第 "+game.day+" 天清晨。你醒来，先摸了摸膝盖。"},
{who:"旁白",text:"膝盖："+PAIN_TEXT[wk.pain]},
{who:"旁白",text:wk.note+(extraNote?"\n（昨夜："+extraNote+"）":"")}],0,()=>{game.mode="walk";hideDialog();});};
if(game.day===1){runEvent("day1_wake_forecast",()=>runEvent("day1_flashback",morning));}
else morning();}
function showSettlement(){game.mode="end";game.chapterDone=true;saveGame(true);
const moralIds=["H1_share_bread","H2_road_wallet","H3_hitchhike","H4_blanket","H5_last_bread"];
const moralDone=moralIds.filter(isDone).length;
const mems=Object.keys(game.memories).filter(m=>MEMORY_TEXT[m]).map(m=>"· "+MEMORY_TEXT[m]);
const ach=[];if(!hasMem("took_ride"))ach.push("🚶 全程徒步——一步一步走完了这一章");
if(hasMem("wallet_returned")||hasMem("wallet_apologized"))ach.push("🤝 诚实旅人");if(hasMem("sofia_helped"))ach.push("🍞 索菲娅的朋友");
showPanel("<h2>第一章 · 完 —— 纳塔莱斯港</h2>"+
"<p>七天，六段路，一条 Ruta 9。你从世界尽头走到了最后希望湾。</p>"+
"<p>📖 学会西语词：<b>"+game.words.length+" / 24</b>　·　💛 完成人性事件：<b>"+moralDone+" / 5</b></p>"+
"<p><b>被谁记住了：</b></p><p>"+(mems.length?mems.join("<br>"):"这一路，你谁也没惊动。")+"</p>"+
(ach.length?"<p><b>成就：</b><br>"+ach.join("<br>")+"</p>":"")+
"<p style='color:#f6d47c'>卡洛斯说：没有直达英国的船——先去布宜诺斯艾利斯，再转船。下周有一班货船。</p>"+
"<p style='font-size:1.15em;color:#fdf6e0'>“Casa no es un lugar. Es el camino de vuelta.”<br>家不是一个地方，是回去的路。</p>"+
"<div class='row'><button onclick='hidePanel();game.mode=\"walk\"'>在码头再走走</button><button class='ghost' onclick='location.reload()'>回到标题</button></div>");}
/* ================= 存档 ================= */
const SAVE_KEY="zjhj_ch1_save_v1";
function saveGame(silent){if(!game)return;const data={day:game.day,res:game.res,words:game.words,memories:game.memories,done:game.done,flags:{phase:game.flags.phase},cookedDay:game.cookedDay,quizDone:game.quizDone,chapterDone:game.chapterDone};
try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));if(!silent)toast("💾 已存档");}catch(e){if(!silent)toast("存档失败：浏览器不允许");}}
function loadGame(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;const d=JSON.parse(raw);
game=newGame();game.day=d.day;game.res=d.res;game.words=d.words||[];game.memories=d.memories||{};game.done=d.done||{};
game.cookedDay=d.cookedDay||0;game.quizDone=!!d.quizDone;game.chapterDone=!!d.chapterDone;game.weather=WEEK[game.day];
loadScene(DAY_SCENE[game.day]);game.flags.phase=(d.flags&&d.flags.phase)||1;updatePhase();return true;}catch(e){return false;}}
/* ================= 输入 ================= */
window.addEventListener("keydown",e=>{const k=e.key.toLowerCase();keys[k]=true;
if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
if((k===" "||k==="enter")&&game){if(lineVisible()&&dlgAdvance&&choiceEl.style.display!=="flex"){dlgAdvance();}
else if(game.mode==="walk")tryInteract();}});
window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});
cv.addEventListener("pointerdown",()=>{if(lineVisible()&&dlgAdvance&&choiceEl.style.display!=="flex")dlgAdvance();});
$("dialog").addEventListener("pointerdown",()=>{if(dlgAdvance&&choiceEl.style.display!=="flex")dlgAdvance();});
document.querySelectorAll("#touch [data-dir]").forEach(b=>{const d=b.dataset.dir;
b.addEventListener("pointerdown",e=>{e.preventDefault();touchDir=d;});
b.addEventListener("pointerup",()=>{if(touchDir===d)touchDir=null;});
b.addEventListener("pointerleave",()=>{if(touchDir===d)touchDir=null;});});
$("btnA").addEventListener("click",()=>{if(lineVisible()&&dlgAdvance&&choiceEl.style.display!=="flex")dlgAdvance();else if(game&&game.mode==="walk")tryInteract();});
$("btnB").addEventListener("click",()=>{if(game&&(game.mode==="walk"))openWords();});
$("btnWords").addEventListener("click",()=>{if(game&&game.mode==="walk")openWords();});
$("btnCamp").addEventListener("click",()=>{if(game&&game.mode==="walk")openCamp(false);});
$("btnSave").addEventListener("click",()=>saveGame(false));
$("btnNew").addEventListener("click",()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){}
game=newGame();$("title").style.display="none";$("hud").style.display="flex";loadScene("town");updatePhase();startDay("");});
$("btnContinue").addEventListener("click",()=>{if(loadGame()){$("title").style.display="none";$("hud").style.display="flex";toast("📖 读档成功：第 "+game.day+" 天");}
else toast("还没有存档");});
if(!localStorage.getItem(SAVE_KEY))$("btnContinue").style.opacity=".5";
/* ================= 主循环 ================= */
let lastT=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;
if(game&&game.mode!=="title"){if(game.mode==="walk")update(dt);render(t/16.7);}}
requestAnimationFrame(loop);
</script>
</body>
