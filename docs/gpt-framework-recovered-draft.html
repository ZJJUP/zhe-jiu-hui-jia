<script>

/* =========================================
   PART 1
   游戏基础框架
========================================= */

const CONFIG = {
    canvasWidth:640, canvasHeight:400,
    tileSize:32, mapWidth:40, mapHeight:30,
    playerSpeed:125,
    saveKey:"the_way_home_chapter1_save",
    autoSaveInterval:10000,
    colors:{
        grass:"#829d72", grass2:"#8ba77a", road:"#b7a17c",
        roadDark:"#9c886c", water:"#729a9c", mountain:"#788b80",
        tree:"#496b4c", treeDark:"#38543e", flower:"#e9d5a2"
    }
};

const game = {
    running:true, paused:false, lastTime:0, deltaTime:0, elapsed:0,
    day:1, chapter:1, location:"Puerto Natales",
    resources:{stamina:85,food:75,money:60,mood:70},
    player:{
        x:12*CONFIG.tileSize,y:14*CONFIG.tileSize,
        width:20,height:25,speed:CONFIG.playerSpeed,
        direction:"down",moving:false,frame:0,frameTimer:0
    },
    camera:{x:0,y:0},
    progress:{
        distance:0,explored:[],learnedWords:[],
        completedEvents:[],npcMemory:{},eventFlags:{}
    },
    weather:{today:"sunny",tomorrow:"cloudy",painLevel:0},
    input:{up:false,down:false,left:false,right:false}
};

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d",{alpha:false});
canvas.width=CONFIG.canvasWidth;
canvas.height=CONFIG.canvasHeight;
ctx.imageSmoothingEnabled=false;

const TILE={
    GRASS:0,GRASS2:1,ROAD:2,ROAD_DARK:3,WATER:4,
    TREE:5,MOUNTAIN:6,FLOWER:7,FENCE:8,SAND:9
};

let worldMap=[];

function generateMap(){
    worldMap=[];
    for(let y=0;y<CONFIG.mapHeight;y++){
        const row=[];
        for(let x=0;x<CONFIG.mapWidth;x++){
            let tile=TILE.GRASS;
            if((x*7+y*13)%11<4) tile=TILE.GRASS2;
            if(y>=11&&y<=17&&x>=5&&x<=20){
                if(y===14||x===12) tile=TILE.ROAD;
            }
            if((x>=7&&x<=10&&y>=9&&y<=11)||(x>=15&&x<=18&&y>=17&&y<=19)){
                if(x===8||x===17||y===10||y===18) tile=TILE.ROAD;
            }
            if(x>=19&&y>=13&&y<=15) tile=TILE.ROAD;
            if(x>=19&&(y===12||y===16)) tile=TILE.GRASS2;
            if(x<5&&y>5&&y<23) tile=TILE.WATER;
            if(y<5) tile=TILE.MOUNTAIN;
            if((x*19+y*23)%37===0&&tile!==TILE.ROAD&&tile!==TILE.WATER&&x>4) tile=TILE.TREE;
            if((x*13+y*17)%41===0&&tile===TILE.GRASS) tile=TILE.FLOWER;
            row.push(tile);
        }
        worldMap.push(row);
    }
    for(let x=6;x<11;x++) worldMap[8][x]=TILE.FENCE;
    for(let y=13;y<=15;y++) for(let x=11;x<=13;x++) worldMap[y][x]=TILE.ROAD;
}

function drawTile(tile,screenX,screenY,x,y){
    const size=CONFIG.tileSize,colors=CONFIG.colors;
    switch(tile){
        case TILE.GRASS:
            ctx.fillStyle=colors.grass;ctx.fillRect(screenX,screenY,size,size);
            ctx.fillStyle="#718e64";
            if((x+y)%3===0) ctx.fillRect(screenX+8,screenY+9,2,4);
            break;
        case TILE.GRASS2:
            ctx.fillStyle=colors.grass2;ctx.fillRect(screenX,screenY,size,size);
            ctx.fillStyle="#78966c";ctx.fillRect(screenX+5,screenY+17,3,2);
            break;
        case TILE.ROAD:
            ctx.fillStyle=colors.road;ctx.fillRect(screenX,screenY,size,size);
            ctx.fillStyle="#c4ae88";
            ctx.fillRect(screenX+6,screenY+8,3,2);
            ctx.fillRect(screenX+22,screenY+24,4,2);
            break;
        case TILE.ROAD_DARK:
            ctx.fillStyle=colors.roadDark;ctx.fillRect(screenX,screenY,size,size);break;
        case TILE.WATER:
            ctx.fillStyle=colors.water;ctx.fillRect(screenX,screenY,size,size);
            ctx.fillStyle="#8eb3b0";
            ctx.fillRect(screenX+5,screenY+9,10,2);
            ctx.fillRect(screenX+18,screenY+23,8,2);break;
        case TILE.MOUNTAIN:
            ctx.fillStyle="#87978a";ctx.fillRect(screenX,screenY,size,size);
            ctx.fillStyle="#aab4a1";ctx.fillRect(screenX+7,screenY+6,13,8);
            ctx.fillStyle="#65796f";ctx.fillRect(screenX+15,screenY+14,12,10);break;
        case TILE.TREE:
            ctx.fillStyle=colors.grass;ctx.fillRect(screenX,screenY,size,size);
            ctx.fillStyle=colors.treeDark;ctx.fillRect(screenX+6,screenY+5,21,20);
            ctx.fillStyle=colors.tree;ctx.fillRect(screenX+9,screenY+3,16,17);
            ctx.fillStyle="#79956b";ctx.fillRect(screenX+12,screenY+6,5,5);
            ctx.fillStyle="#775c43";ctx.fillRect(screenX+15,screenY+23,5,8);break;
        case TILE.FLOWER:
            ctx.fillStyle=colors.grass;ctx.fillRect(screenX,screenY,size,size);
            ctx.fillStyle=colors.flower;
            ctx.fillRect(screenX+12,screenY+13,4,4);
            ctx.fillRect(screenX+18,screenY+19,3,3);break;
        case TILE.FENCE:
            ctx.fillStyle=colors.grass;ctx.fillRect(screenX,screenY,size,size);
            ctx.fillStyle="#80674c";
            ctx.fillRect(screenX+3,screenY+10,27,4);
            ctx.fillRect(screenX+3,screenY+22,27,4);
            ctx.fillRect(screenX+5,screenY+5,4,26);
            ctx.fillRect(screenX+23,screenY+5,4,26);break;
        case TILE.SAND:
            ctx.fillStyle="#c5ae82";ctx.fillRect(screenX,screenY,size,size);break;
        default:
            ctx.fillStyle=colors.grass;ctx.fillRect(screenX,screenY,size,size);
    }
}

function getTileAtPixel(x,y){
    const tileX=Math.floor(x/CONFIG.tileSize),tileY=Math.floor(y/CONFIG.tileSize);
    if(tileX<0||tileY<0||tileX>=CONFIG.mapWidth||tileY>=CONFIG.mapHeight) return null;
    return worldMap[tileY][tileX];
}

function isBlocked(x,y){
    const points=[[x+3,y+4],[x+17,y+4],[x+3,y+23],[x+17,y+23]];
    for(const point of points){
        const tile=getTileAtPixel(point[0],point[1]);
        if(tile===null||tile===TILE.WATER||tile===TILE.TREE||tile===TILE.MOUNTAIN||tile===TILE.FENCE) return true;
    }
    return false;
}

function drawPlayer(){
    const p=game.player;
    const sx=Math.round(p.x-game.camera.x),sy=Math.round(p.y-game.camera.y);
    let bounce=0;
    if(p.moving) bounce=Math.sin(p.frame*8)*2;
    const y=sy+bounce;
    ctx.fillStyle="rgba(30,45,32,0.28)";ctx.fillRect(sx+3,sy+22,18,5);
    ctx.fillStyle="#8a6448";ctx.fillRect(sx+3,y+8,15,13);
    ctx.fillStyle="#537d75";ctx.fillRect(sx+4,y+10,12,10);
    ctx.fillStyle="#e6bd91";ctx.fillRect(sx+5,y+1,11,10);
    ctx.fillStyle="#463c32";ctx.fillRect(sx+5,y,11,4);
    ctx.fillStyle="#382f29";
    if(p.direction==="down"){ctx.fillRect(sx+7,y+6,2,2);ctx.fillRect(sx+13,y+6,2,2);}
    if(p.direction==="left") ctx.fillRect(sx+5,y+6,2,2);
    if(p.direction==="right") ctx.fillRect(sx+15,y+6,2,2);
    ctx.fillStyle="#344b4a";
    if(p.moving&&Math.sin(p.frame*8)>0){
        ctx.fillRect(sx+5,y+20,5,5);ctx.fillRect(sx+13,y+21,5,4);
    }else{
        ctx.fillRect(sx+5,y+20,5,5);ctx.fillRect(sx+12,y+20,5,5);
    }
}

function updateCamera(){
    const p=game.player;
    game.camera.x=p.x+p.width/2-CONFIG.canvasWidth/2;
    game.camera.y=p.y+p.height/2-CONFIG.canvasHeight/2;
    const maxX=CONFIG.mapWidth*CONFIG.tileSize-CONFIG.canvasWidth;
    const maxY=CONFIG.mapHeight*CONFIG.tileSize-CONFIG.canvasHeight;
    game.camera.x=Math.max(0,Math.min(maxX,game.camera.x));
    game.camera.y=Math.max(0,Math.min(maxY,game.camera.y));
}

function renderWorld(){
    ctx.fillStyle="#829d72";ctx.fillRect(0,0,CONFIG.canvasWidth,CONFIG.canvasHeight);
    const size=CONFIG.tileSize;
    const startX=Math.max(0,Math.floor(game.camera.x/size));
    const startY=Math.max(0,Math.floor(game.camera.y/size));
    const endX=Math.min(CONFIG.mapWidth,Math.ceil((game.camera.x+CONFIG.canvasWidth)/size)+1);
    const endY=Math.min(CONFIG.mapHeight,Math.ceil((game.camera.y+CONFIG.canvasHeight)/size)+1);
    for(let y=startY;y<endY;y++){
        for(let x=startX;x<endX;x++){
            drawTile(worldMap[y][x],Math.round(x*size-game.camera.x),Math.round(y*size-game.camera.y),x,y);
        }
    }
    drawPlayer();
}

const keyMap={KeyW:"up",ArrowUp:"up",KeyS:"down",ArrowDown:"down",KeyA:"left",ArrowLeft:"left",KeyD:"right",ArrowRight:"right"};
document.addEventListener("keydown",event=>{
    const direction=keyMap[event.code];
    if(direction){event.preventDefault();game.input[direction]=true;}
});
document.addEventListener("keyup",event=>{
    const direction=keyMap[event.code];
    if(direction) game.input[direction]=false;
});
window.addEventListener("blur",()=>clearInput());

function clearInput(){
    for(const key in game.input) game.input[key]=false;
    document.querySelectorAll(".dpad-btn").forEach(btn=>btn.classList.remove("active"));
}

const dpadButtons={up:document.getElementById("up"),down:document.getElementById("down"),left:document.getElementById("left"),right:document.getElementById("right")};
function bindTouchButton(direction,button){
    button.addEventListener("pointerdown",event=>{
        event.preventDefault();game.input[direction]=true;button.classList.add("active");button.setPointerCapture(event.pointerId);
    });
    function release(event){event.preventDefault();game.input[direction]=false;button.classList.remove("active");}
    button.addEventListener("pointerup",release);
    button.addEventListener("pointercancel",release);
    button.addEventListener("lostpointercapture",()=>{
        game.input[direction]=false;button.classList.remove("active");
    });
}
for(const direction in dpadButtons) bindTouchButton(direction,dpadButtons[direction]);
document.getElementById("center").addEventListener("pointerdown",event=>{event.preventDefault();clearInput();});

function updatePlayer(dt){
    const p=game.player;
    let dx=0,dy=0;
    if(game.input.left) dx-=1;
    if(game.input.right) dx+=1;
    if(game.input.up) dy-=1;
    if(game.input.down) dy+=1;
    const length=Math.sqrt(dx*dx+dy*dy);
    p.moving=length>0;
    if(!p.moving) return;
    dx/=length;dy/=length;
    if(Math.abs(dx)>Math.abs(dy)) p.direction=dx>0?"right":"left";
    else p.direction=dy>0?"down":"up";
    let speed=p.speed;
    if(game.resources.stamina<20) speed*=.75;
    const moveX=dx*speed*dt,moveY=dy*speed*dt;
    const oldX=p.x,oldY=p.y;
    if(!isBlocked(p.x+moveX,p.y)) p.x+=moveX;
    if(!isBlocked(p.x,p.y+moveY)) p.y+=moveY;
    const moved=Math.hypot(p.x-oldX,p.y-oldY);
    if(moved>0) game.progress.distance+=moved/1000;
    p.frameTimer+=dt;
    if(p.frameTimer>=.16){p.frame++;p.frameTimer=0;}
}

function clamp(value,min=0,max=100){return Math.max(min,Math.min(max,value));}

function updateHUD(){
    const resources=game.resources;
    const fields=[
        {key:"stamina",value:"stamina-value",bar:"stamina-bar"},
        {key:"food",value:"food-value",bar:"food-bar"},
        {key:"money",value:"money-value",bar:"money-bar"},
        {key:"mood",value:"mood-value",bar:"mood-bar"}
    ];
    fields.forEach(field=>{
        const value=clamp(resources[field.key]);
        document.getElementById(field.value).textContent=Math.round(value);
        document.getElementById(field.bar).style.width=value+"%";
    });
    document.getElementById("chapter-info").textContent=`CHAPTER 01 · 智利篇 · DAY ${game.day}`;
    document.getElementById("position-label").textContent=`X: ${Math.floor(game.player.x/32)} · Y: ${Math.floor(game.player.y/32)}`;
}

function getSaveData(){
    return {
        version:1,savedAt:new Date().toISOString(),day:game.day,chapter:game.chapter,location:game.location,
        resources:{...game.resources},
        player:{x:game.player.x,y:game.player.y,direction:game.player.direction},
        progress:{
            distance:game.progress.distance,explored:[...game.progress.explored],
            learnedWords:[...game.progress.learnedWords],completedEvents:[...game.progress.completedEvents],
            npcMemory:structuredClone(game.progress.npcMemory),eventFlags:structuredClone(game.progress.eventFlags)
        },
        weather:{...game.weather}
    };
}

function saveGame(){
    try{
        localStorage.setItem(CONFIG.saveKey,JSON.stringify(getSaveData()));
        showStatus("游戏已保存");return true;
    }catch(error){console.error("保存失败：",error);showStatus("保存失败，请检查浏览器存储权限");return false;}
}

function loadGame(){
    try{
        const raw=localStorage.getItem(CONFIG.saveKey);
        if(!raw){showStatus("没有找到存档");return false;}
        const data=JSON.parse(raw);
        if(!data||data.version!==1||!data.player||!data.resources){showStatus("存档格式不正确");return false;}
        game.day=data.day||1;game.chapter=data.chapter||1;game.location=data.location||"Puerto Natales";
        Object.assign(game.resources,data.resources);
        game.player.x=data.player.x;game.player.y=data.player.y;game.player.direction=data.player.direction||"down";
        if(data.progress){
            game.progress.distance=data.progress.distance||0;
            game.progress.explored=data.progress.explored||[];
            game.progress.learnedWords=data.progress.learnedWords||[];
            game.progress.completedEvents=data.progress.completedEvents||[];
            game.progress.npcMemory=data.progress.npcMemory||{};
            game.progress.eventFlags=data.progress.eventFlags||{};
        }
        if(data.weather) Object.assign(game.weather,data.weather);
        if(isBlocked(game.player.x,game.player.y)){game.player.x=12*CONFIG.tileSize;game.player.y=14*CONFIG.tileSize;}
        clearInput();updateCamera();updateHUD();showStatus("存档读取成功");return true;
    }catch(error){console.error("读取存档失败：",error);showStatus("存档读取失败");return false;}
}

function autoSave(){saveGame();}
function showStatus(message){document.getElementById("movement-status").textContent=message;}
document.getElementById("save-btn").addEventListener("click",saveGame);
document.getElementById("load-btn").addEventListener("click",loadGame);

const EventSystem={trigger(eventId){},checkConditions(){},complete(eventId){}};
const DialogueSystem={start(dialogueId){},show(text){},choose(optionId){},close(){}};
const WordSystem={
    learn(wordId){},
    test(){},
    isLearned(wordId){return game.progress.learnedWords.includes(wordId);}
};
const WeatherSystem={forecast(){},update(){},getTomorrowWeather(){return game.weather.tomorrow;}};
const CampSystem={open(){},cook(){},sleep(){}};

   PART 1 END
   PART 2 begins below
========================================= */


/* =========================================
   PART 2
   事件、对话、词库、天气、扎营及游戏启动
========================================= */

let dialogueState={
    active:false,eventId:null,choices:[],onClose:null
};

DialogueSystem.show=function(text){
    dialogueState.active=true;
    dialogueState.eventId=null;
    dialogueState.choices=[];
    dialogueState.onClose=null;
    document.getElementById("dialog-title").textContent="旅行记录";
    document.getElementById("dialog-content").textContent=text;
    const options=document.getElementById("dialog-options");
    options.innerHTML="";
    const button=document.createElement("button");
    button.className="dialog-option";
    button.textContent="继续";
    button.addEventListener("click",()=>DialogueSystem.close());
    options.appendChild(button);
    document.getElementById("overlay").classList.add("visible");
    game.paused=true;
};

DialogueSystem.start=function(dialogueId){
    const event=EVENT_DATA[dialogueId];
    if(!event){console.warn("找不到事件：",dialogueId);return false;}
    if(game.progress.completedEvents.includes(dialogueId)) return false;
    dialogueState.active=true;
    dialogueState.eventId=dialogueId;
    dialogueState.choices=event.choices||[];
    dialogueState.onClose=null;
    document.getElementById("dialog-title").textContent=event.title||"旅行事件";
    document.getElementById("dialog-content").textContent=event.text||"";
    const options=document.getElementById("dialog-options");
    options.innerHTML="";
    dialogueState.choices.forEach((choice,index)=>{
        const button=document.createElement("button");
        button.className="dialog-option";
        button.textContent=choice.text;
        button.addEventListener("click",()=>DialogueSystem.choose(index));
        options.appendChild(button);
    });
    document.getElementById("overlay").classList.add("visible");
    game.paused=true;
    return true;
};

DialogueSystem.choose=function(index){
    const choice=dialogueState.choices[index];
    if(!choice) return;
    const eventId=dialogueState.eventId;
    dialogueState.choices=[];
    document.getElementById("dialog-options").innerHTML="";
    try{
        if(typeof choice.action==="function") choice.action();
    }catch(error){
        console.error("事件执行错误：",error);
        DialogueSystem.show("发生了一点意外。\n你决定暂时继续自己的旅程。");
        return;
    }
    if(eventId) game.progress.completedEvents.push(eventId);
    updateHUD();
    if(dialogueState.eventId===eventId&&dialogueState.active) DialogueSystem.close();
};

DialogueSystem.close=function(){
    dialogueState.active=false;
    dialogueState.eventId=null;
    dialogueState.choices=[];
    document.getElementById("overlay").classList.remove("visible");
    game.paused=false;
    clearInput();
    updateHUD();
};

EventSystem.trigger=function(eventId){
    return DialogueSystem.start(eventId);
};

EventSystem.complete=function(eventId){
    if(!game.progress.completedEvents.includes(eventId)) game.progress.completedEvents.push(eventId);
};

EventSystem.checkConditions=function(){
    if(game.day>=5&&game.progress.eventFlags.ignoredFence&&!game.progress.eventFlags.sheepOnRoad){
        game.progress.eventFlags.sheepOnRoad=true;
        return "sheep_herd";
    }
    if(game.progress.eventFlags.helpedTraveler&&game.day>=5&&!game.progress.eventFlags.travelerThanked){
        game.progress.eventFlags.travelerThanked=true;
        return "traveler_music";
    }
    return null;
};

WordSystem.learn=function(wordId){
    const word=WORD_DATA.find(w=>w.id===wordId);
    if(!word) return false;
    if(game.progress.learnedWords.includes(wordId)) return false;
    game.progress.learnedWords.push(wordId);
    showStatus("学会新词："+word.spanish);
    return true;
};

WordSystem.getLearned=function(){
    return WORD_DATA.filter(word=>game.progress.learnedWords.includes(word.id));
};

WordSystem.getTodayWords=function(){
    return WORD_DATA.filter(word=>word.day===game.day&&!game.progress.learnedWords.includes(word.id));
};

WordSystem.showVocabulary=function(){
    const words=WordSystem.getLearned();
    if(!words.length){
        DialogueSystem.show("你还没有学会任何西班牙语词汇。\n继续旅行，尝试与当地人交流吧。");
        return;
    }
    const content=words.map(word=>word.spanish+" — "+word.chinese).join("\n");
    DialogueSystem.show("你的西班牙语词汇本\n\n"+content);
};

WordSystem.test=function(){
    const learned=WordSystem.getLearned();
    if(learned.length===0){
        DialogueSystem.show("今天还没有学会新词。\n明天继续努力吧。");
        return;
    }
    const questions=learned.slice(-3);
    let index=0,correct=0;
    function nextQuestion(){
        if(index>=questions.length){
            game.resources.mood=clamp(game.resources.mood+correct*2);
            DialogueSystem.show("词汇小测完成！\n\n答对："+correct+"/"+questions.length+"\n\n你正在逐渐适应这里的语言。");
            return;
        }
        const word=questions[index];
        const wrongOptions=WORD_DATA.filter(w=>w.id!==word.id).sort(()=>Math.random()-.5).slice(0,2);
        const options=[word,...wrongOptions].sort(()=>Math.random()-.5);
        dialogueState.active=true;
        dialogueState.eventId=null;
        dialogueState.choices=[];
        document.getElementById("dialog-title").textContent="西班牙语小测 · "+(index+1)+"/"+questions.length;
        document.getElementById("dialog-content").textContent="「"+word.spanish+"」是什么意思？";
        const container=document.getElementById("dialog-options");
        container.innerHTML="";
        options.forEach(option=>{
            const button=document.createElement("button");
            button.className="dialog-option";
            button.textContent=option.chinese;
            button.onclick=()=>{
                if(option.id===word.id){correct++;showStatus("回答正确！");}
                else showStatus("正确答案："+word.chinese);
                index++;
                setTimeout(nextQuestion,350);
            };
            container.appendChild(button);
        });
        document.getElementById("overlay").classList.add("visible");
        game.paused=true;
    }
    nextQuestion();
};

const WEATHER_DATA={
    sunny:{name:"晴天",description:"天空晴朗，适合继续旅行。",speed:1,staminaExtra:0},
    cloudy:{name:"多云",description:"天空有云，天气比较稳定。",speed:1,staminaExtra:0},
    light_rain:{name:"小雨",description:"雨水打湿了道路，行走变得困难。",speed:.85,staminaExtra:1},
    rain:{name:"大雨",description:"雨势较大，最好寻找避雨地点。",speed:.65,staminaExtra:2}
};

WeatherSystem.forecast=function(){
    const pain=clamp(game.weather.painLevel,0,3);
    const probabilities={
        0:[.60,.30,.10,0],
        1:[.20,.50,.25,.05],
        2:[.10,.25,.50,.15],
        3:[.05,.15,.45,.35]
    };
    const names=["sunny","cloudy","light_rain","rain"];
    const random=Math.random();
    let accumulated=0,result="cloudy";
    for(let i=0;i<names.length;i++){
        accumulated+=probabilities[pain][i];
        if(random<=accumulated){result=names[i];break;}
    }
    game.weather.tomorrow=result;
    const confidence=["不确定","初步判断","比较可靠","明显的身体预感"][pain];
    showStatus("明日天气预感："+WEATHER_DATA[result].name+" · "+confidence);
    return result;
};

WeatherSystem.update=function(){
    const weather=WEATHER_DATA[game.weather.today]||WEATHER_DATA.sunny;
    game.player.speed=CONFIG.playerSpeed*weather.speed;
};

WeatherSystem.getTomorrowWeather=function(){
    return game.weather.tomorrow;
};

WeatherSystem.showForecast=function(){
    const weather=WEATHER_DATA[game.weather.tomorrow];
    DialogueSystem.show("关节天气预报\n\n膝盖疼痛等级："+game.weather.painLevel+"/3\n\n明日预测："+weather.name+"\n\n"+weather.description);
};

let rainParticles=[];

function updateRain(dt){
    if(game.weather.today!=="rain"&&game.weather.today!=="light_rain"){rainParticles=[];return;}
    const amount=game.weather.today==="rain"?75:35;
    while(rainParticles.length<amount){
        rainParticles.push({x:Math.random()*CONFIG.canvasWidth,y:Math.random()*CONFIG.canvasHeight,speed:180+Math.random()*180});
    }
    rainParticles.forEach(p=>{
        p.x-=35*dt;p.y+=p.speed*dt;
        if(p.y>CONFIG.canvasHeight){p.y=-10;p.x=Math.random()*CONFIG.canvasWidth;}
    });
}

function drawRain(){
    if(game.weather.today!=="rain"&&game.weather.today!=="light_rain") return;
    ctx.save();
    ctx.strokeStyle="rgba(210,225,230,0.48)";
    ctx.lineWidth=1;
    rainParticles.forEach(p=>{
        ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-4,p.y+10);ctx.stroke();
    });
    ctx.restore();
}

let campState={opened:false,cooked:false,slept:false};

CampSystem.open=function(){
    if(campState.opened) return;
    campState.opened=true;
    game.paused=true;
    document.getElementById("dialog-title").textContent="傍晚 · 扎营";
    document.getElementById("dialog-content").textContent=
        "太阳逐渐落到山后。\n你需要整理背包，为明天的旅程做好准备。\n\n"+
        "体力："+Math.round(game.resources.stamina)+
        "\n食物："+Math.round(game.resources.food)+
        "\n心情："+Math.round(game.resources.mood);
    const options=document.getElementById("dialog-options");
    options.innerHTML="";
    function addOption(text,callback){
        const button=document.createElement("button");
        button.className="dialog-option";
        button.textContent=text;
        button.onclick=callback;
        options.appendChild(button);
    }
    addOption("🍲 做一顿简单的饭",()=>CampSystem.cook());
    addOption("📖 复习今天学到的西语",()=>WordSystem.test());
    addOption("📚 查看词汇本",()=>WordSystem.showVocabulary());
    addOption("🦵 检查关节和明天天气",()=>WeatherSystem.showForecast());
    addOption("🌙 睡觉，进入下一天",()=>CampSystem.sleep());
    document.getElementById("overlay").classList.add("visible");
};

CampSystem.cook=function(){
    if(campState.cooked){DialogueSystem.show("今天已经做过饭了。\n你可以选择休息或者睡觉。");return;}
    if(game.resources.food<10){DialogueSystem.show("食物不够了。\n你只能简单整理背包，然后休息。");return;}
    game.resources.food-=10;
    game.resources.stamina=clamp(game.resources.stamina+10);
    game.resources.mood=clamp(game.resources.mood+5);
    campState.cooked=true;
    DialogueSystem.show("你用剩下的食材做了一顿简单的晚餐。\n\n体力恢复 10。\n心情恢复 5。\n食物减少 10。");
};

CampSystem.sleep=function(){
    if(campState.slept) return;
    campState.slept=true;
    game.resources.food-=15;
    game.resources.stamina=clamp(game.resources.stamina+35);
    game.resources.mood=clamp(game.resources.mood+5);
    if(game.resources.food<0){
        game.resources.food=0;
        game.resources.stamina=clamp(game.resources.stamina-5);
    }
    game.weather.today=game.weather.tomorrow;
    game.day++;
    campState={opened:false,cooked:false,slept:false};
    game.resources.stamina=clamp(game.resources.stamina);
    game.resources.food=clamp(game.resources.food);
    game.resources.mood=clamp(game.resources.mood);
    WeatherSystem.update();
    updateHUD();
    autoSave();
    DialogueSystem.show("新的一天开始了。\n\nDAY "+game.day+"\n\n天气："+WEATHER_DATA[game.weather.today].name+"\n\n你整理好背包，准备继续旅程。");
    setTimeout(()=>{
        if(game.day<=7) game.weather.painLevel=Math.min(3,game.weather.painLevel);
    },100);
};

CampSystem.rest=function(){
    game.resources.stamina=clamp(game.resources.stamina+8);
    game.resources.mood=clamp(game.resources.mood+2);
    updateHUD();
    DialogueSystem.show("你坐下来休息了一会儿。\n\n体力恢复 8。\n心情恢复 2。");
};

function drawNPCs(){
    NPC_DATA.forEach(npc=>{
        const x=npc.x*CONFIG.tileSize-game.camera.x;
        const y=npc.y*CONFIG.tileSize-game.camera.y;
        ctx.fillStyle="rgba(30,40,30,0.25)";ctx.fillRect(x+5,y+22,17,4);
        ctx.fillStyle=npc.color;ctx.fillRect(x+6,y+10,13,12);
        ctx.fillStyle="#e5b992";ctx.fillRect(x+7,y+2,11,10);
        ctx.fillStyle="#493a30";ctx.fillRect(x+7,y+1,11,4);
        ctx.font="10px monospace";ctx.textAlign="center";ctx.fillStyle="#fff4da";
        ctx.fillText(npc.name,x+12,y-5);
        const distance=Math.hypot(game.player.x-npc.x*CONFIG.tileSize,game.player.y-npc.y*CONFIG.tileSize);
        if(distance<65){ctx.fillStyle="#f5d58a";ctx.fillText("E",x+12,y-17);}
    });
}

const originalRenderWorld=renderWorld;
renderWorld=function(){
    originalRenderWorld();
    drawNPCs();
    drawRain();
};

function findNearbyInteractable(){
    let nearest=null,shortest=65;
    INTERACTABLES.forEach(item=>{
        const x=item.x*CONFIG.tileSize,y=item.y*CONFIG.tileSize;
        const distance=Math.hypot(game.player.x-x,game.player.y-y);
        if(distance<shortest){shortest=distance;nearest=item;}
    });
    return nearest;
}

function interact(){
    if(game.paused) return;
    const item=findNearbyInteractable();
    if(!item){showStatus("附近没有可以互动的对象");return;}
    if(item.type==="npc"){
        if(item.npcId==="elena") EventSystem.trigger("elena_intro");
        else if(item.npcId==="little_girl") EventSystem.trigger("girl_bread");
        else if(item.npcId==="mateo") EventSystem.trigger("mateo_intro");
        else if(item.npcId==="sofia") EventSystem.trigger("sofia_intro");
    }else if(item.type==="rest"){
        CampSystem.rest();
    }else if(item.type==="scenery"){
        game.resources.mood=clamp(game.resources.mood+5);
        updateHUD();
        DialogueSystem.show("你坐在海湾旁边。\n远处的山脉倒映在水面上。\n你觉得这段旅程或许没有想象中那么糟糕。");
    }
}

document.addEventListener("keydown",event=>{
    if((event.code==="KeyE"||event.code==="Enter")&&!event.repeat) interact();
    if(event.code==="Escape"&&dialogueState.active) DialogueSystem.close();
});

const DAY1_SEQUENCE={started:false,morningDone:false,bakeryDone:false,girlDone:false,injuryDone:false};

function startDay1(){
    if(DAY1_SEQUENCE.started) return;
    DAY1_SEQUENCE.started=true;
    game.day=1;
    game.location="Puerto Natales";
    game.weather.today="sunny";
    game.weather.painLevel=1;
    updateHUD();
    EventSystem.trigger("morning_forecast");
}

function checkDay1Progress(){
    if(game.day===1&&!DAY1_SEQUENCE.morningDone&&game.progress.completedEvents.includes("morning_forecast")){
        DAY1_SEQUENCE.morningDone=true;
        showStatus("前往面包店，与 Elena 交流");
    }
    if(game.day===1&&!DAY1_SEQUENCE.bakeryDone&&game.progress.completedEvents.includes("elena_intro")){
        DAY1_SEQUENCE.bakeryDone=true;
        showStatus("试着与面包店外的小女孩交流");
    }
    if(game.day===1&&!DAY1_SEQUENCE.girlDone&&game.progress.completedEvents.includes("girl_bread")){
        DAY1_SEQUENCE.girlDone=true;
        showStatus("继续探索，感受这座小镇");
    }
}

function triggerDay1Injury(){
    if(game.day===1&&DAY1_SEQUENCE.girlDone&&!DAY1_SEQUENCE.injuryDone){
        DAY1_SEQUENCE.injuryDone=true;
        EventSystem.trigger("knee_injury");
    }
}

function triggerDailyEvent(eventId){
    if(game.progress.completedEvents.includes(eventId)) return false;
    return EventSystem.trigger(eventId);
}

function checkDailyEvents(){
    const day=game.day;
    const schedule={
        2:["mild_pain"],3:["road_wallet"],4:["strong_pain","broken_fence"],
        5:["cold_joint","truck_driver"],6:["last_meal"],7:["pain_relief"]
    };
    const events=schedule[day];
    if(!events) return;
    events.forEach(eventId=>{
        if(!game.progress.completedEvents.includes(eventId)){
            // 事件由玩家靠近相应地点或完成当天主线时触发。
        }
    });
}

let movementStaminaTimer=0;
const originalUpdatePlayer=updatePlayer;
updatePlayer=function(dt){
    if(game.paused) return;
    const wasMoving=game.player.moving;
    originalUpdatePlayer(dt);
    if(game.player.moving){
        movementStaminaTimer+=dt;
        if(movementStaminaTimer>=12){
            game.resources.stamina=clamp(game.resources.stamina-1);
            movementStaminaTimer=0;
            updateHUD();
        }
    }else if(wasMoving){
        movementStaminaTimer=0;
    }
    game.player.speed=CONFIG.playerSpeed;
    WeatherSystem.update();
};

function gameLoop(timestamp){
    if(!game.running) return;
    if(!game.lastTime) game.lastTime=timestamp;
    const dt=Math.min((timestamp-game.lastTime)/1000,.05);
    game.lastTime=timestamp;
    game.deltaTime=dt;
    if(!game.paused){
        game.elapsed+=dt;
        updatePlayer(dt);
        updateCamera();
        updateRain(dt);
        checkDay1Progress();
    }
    renderWorld();
    requestAnimationFrame(gameLoop);
}

function resizeGame(){
    ctx.imageSmoothingEnabled=false;
    updateCamera();
}
window.addEventListener("resize",resizeGame);

setInterval(()=>{
    if(game.running&&!game.paused&&game.elapsed>5) autoSave();
},CONFIG.autoSaveInterval);

function initializeGame(){
    generateMap();
    const hasSave=Boolean(localStorage.getItem(CONFIG.saveKey));
    if(hasSave){
        const loaded=loadGame();
        if(loaded){
            updateCamera();
            updateHUD();
            showStatus("欢迎回来，继续你的旅程");
        }else{
            startDay1();
        }
    }else{
        startDay1();
    }
    resizeGame();
    updateCamera();
    updateHUD();
    requestAnimationFrame(gameLoop);
}

initializeGame();

window.GameDebug={
    game,events:EVENT_DATA,words:WORD_DATA,npcs:NPC_DATA,
    save:saveGame,load:loadGame,interact,camp:CampSystem,
    weather:WeatherSystem,vocabulary:WordSystem,
    trigger:(id)=>EventSystem.trigger(id),
    setDay:(day)=>{game.day=clamp(day,1,7);updateHUD();}
};
